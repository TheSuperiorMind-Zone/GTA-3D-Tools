name: Build Danica EXE

on:
  push:
    branches:
      - build-danica-exe
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out isolated build branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Extract the original Danica bundle
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GITHUB_WORKSPACE
          $archive = Join-Path $root "Danica (Tools).rar"
          $extract = Join-Path $env:RUNNER_TEMP "danica-original"
          $report = Join-Path $root "build-report.txt"
          if (!(Test-Path $archive)) { throw "Original archive missing: $archive" }

          $sevenZip = Join-Path $env:ProgramFiles "7-Zip\7z.exe"
          if (!(Test-Path $sevenZip)) {
            choco install 7zip -y --no-progress
          }
          if (!(Test-Path $sevenZip)) { throw "7-Zip was not installed." }

          New-Item -ItemType Directory -Force -Path $extract | Out-Null
          & $sevenZip x $archive "-o$extract" -y
          if ($LASTEXITCODE -ne 0) { throw "RAR extraction failed with code $LASTEXITCODE." }

          $src = Join-Path $extract "Danica (Tools)"
          $toolDir = Join-Path $src "Convert"
          foreach ($name in @("DFF.exe", "TXD.exe", "IFP.exe", "Texture.exe")) {
            $p = Join-Path $toolDir $name
            if (!(Test-Path $p)) { throw "Original converter missing after extraction: $p" }
            $item = Get-Item $p
            if ($item.Length -lt 10000) { throw "Original converter looks truncated: $p" }
          }
          $pack = Join-Path $src "Packs\Convert\GTA_PS2_TO_VC.pack"
          if (!(Test-Path $pack)) { throw "GTA_PS2_TO_VC.pack is missing." }

          @(
            "Original archive: $archive"
            "Extracted root: $src"
            "DFF.exe: $((Get-Item (Join-Path $toolDir 'DFF.exe')).Length) bytes"
            "TXD.exe: $((Get-Item (Join-Path $toolDir 'TXD.exe')).Length) bytes"
            "IFP.exe: $((Get-Item (Join-Path $toolDir 'IFP.exe')).Length) bytes"
            "Texture.exe: $((Get-Item (Join-Path $toolDir 'Texture.exe')).Length) bytes"
            "Pack preset: GTA_PS2_TO_VC.pack"
            "Source check: PASS"
          ) | Set-Content $report
          "DANICA_SRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DANICA_TOOL_DIR=$toolDir" | Out-File -FilePath $env:GITHUB_ENV -Append
          "DANICA_PACK=$pack" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Install PyInstaller
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "pip upgrade failed." }
          python -m pip install pyinstaller
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller installation failed." }

      - name: Build one-file Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GITHUB_WORKSPACE
          $source = Join-Path $root "Danica-Standalone\danica_launcher.py"
          $out = Join-Path $root "out"
          $work = Join-Path $env:RUNNER_TEMP "danica-pyinstaller-work"
          $spec = Join-Path $env:RUNNER_TEMP "danica-pyinstaller-spec"
          if (!(Test-Path $source)) { throw "Launcher source missing: $source" }
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          python -m py_compile $source
          if ($LASTEXITCODE -ne 0) { throw "Launcher syntax validation failed." }

          $pyArgs = @(
            "-m", "PyInstaller", "--noconfirm", "--clean", "--onefile", "--windowed",
            "--name", "Danica", "--distpath", $out, "--workpath", $work, "--specpath", $spec
          )
          foreach ($name in @("DFF.exe", "TXD.exe", "IFP.exe", "Texture.exe")) {
            $pyArgs += @("--add-binary", ((Join-Path $env:DANICA_TOOL_DIR $name) + ";Convert"))
          }
          $pyArgs += @("--add-data", ($env:DANICA_PACK + ";Packs\Convert"))
          $pyArgs += $source

          python @pyArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed with code $LASTEXITCODE." }
          $exe = Join-Path $out "Danica.exe"
          if (!(Test-Path $exe)) { throw "Build finished without out\Danica.exe." }
          $item = Get-Item $exe
          if ($item.Length -lt 500000) { throw "Danica.exe is unexpectedly small ($($item.Length) bytes)." }

          "EXE size: $($item.Length) bytes" | Add-Content (Join-Path $root "build-report.txt")
          "EXE SHA256: $((Get-FileHash $exe -Algorithm SHA256).Hash)" | Add-Content (Join-Path $root "build-report.txt")

      - name: Validate bundled resources inside the EXE
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = $env:GITHUB_WORKSPACE
          Push-Location $root
          try {
            $exe = Join-Path $root "out\Danica.exe"
            $proc = Start-Process -FilePath $exe -ArgumentList "--self-test" -WorkingDirectory $root -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "The standalone resource self-test failed with exit code $($proc.ExitCode)." }
            $test = Join-Path $root "Danica-self-test.txt"
            if (!(Test-Path $test)) { throw "The self-test report was not produced." }
            Get-Content $test
            if ((Get-Content $test -Raw) -notmatch "RESULT: PASS") { throw "Embedded resource validation did not pass." }
            Add-Content (Join-Path $root "build-report.txt") (Get-Content $test)
            "Standalone resource validation: PASS" | Add-Content (Join-Path $root "build-report.txt")
          }
          finally {
            Pop-Location
          }

      - name: Upload the EXE and build report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Danica-Windows-EXE
          path: |
            out/Danica.exe
            build-report.txt
            Danica-self-test.txt
          if-no-files-found: warn
          retention-days: 30
